name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi cmake git ninja-build

    - name: Run Setup Script (Clone FreeRTOS)
      run: bash scripts/setup.sh

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake

    - name: Build
      run: cmake --build build

    - name: Print binary size
      run: arm-none-eabi-size build/rtos-task-manager.elf
