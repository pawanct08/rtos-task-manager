name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install ARM Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi cmake git

    - name: Run Setup Script (Clone FreeRTOS)
      run: bash scripts/setup.sh

    - name: Configure CMake
      run: cmake -B build

    - name: Build
      run: cmake --build build
